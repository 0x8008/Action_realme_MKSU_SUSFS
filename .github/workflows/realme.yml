name: Build Realme GT8 Pro (SukiSU Ultra + SUSFS)

# Builds a SukiSU-Ultra + SUSFS patched GKI kernel for the Realme GT8 Pro (RMX5200, CN).
# Platform: canoe / SM8850 (Snapdragon 8 Elite Gen 5) - Android 16 (AndroidB) - kernel 6.12
# Kernel OSS: https://github.com/realme-kernel-opensource (realme_GT8pro-AndroidB-*)

on:
  workflow_dispatch:
    inputs:
      BUILD_METHOD:
        type: choice
        description: "Build variant (perf = user, consolidate = userdebug)"
        required: true
        default: perf
        options:
          - perf
          - consolidate
      SUSFS_CI:
        type: boolean
        description: "Download SUSFS module from CI build? (false = GitHub Release)"
        required: true
        default: true
      VFS:
        type: boolean
        description: "Manual hooks (VFS) - affects artifact name/tag"
        required: true
        default: true
      KPM:
        type: boolean
        description: "Enable KPM (Kernel Patch Module)?"
        required: true
        default: true
      ZRAM:
        type: boolean
        description: "Add extra ZRAM algorithms (LZ4KD)?"
        required: true
        default: false

# Device constants for the Realme GT8 Pro. These replace the OnePlus manifest inputs.
env:
  DEVICE_NAME: realme_GT8_Pro
  DEVICE_MODEL: RMX5200
  CPUD: canoe
  ANDROID_VERSION: android16
  KERNEL_VERSION: "6.12"
  VENDOR_REPO: https://github.com/realme-kernel-opensource/realme_GT8pro-AndroidB-vendor-source.git
  COMMON_REPO: https://github.com/realme-kernel-opensource/realme_GT8pro-AndroidB-common-source.git
  MSM_REPO: https://github.com/realme-kernel-opensource/realme_GT8pro-AndroidB-kernel-source.git

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      # Check out this repo so the helper scripts under .github/scripts are available.
      # Runs after maximize-build-space so the checkout lands on the enlarged workspace.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "builder"
          git config --global user.email "builder@localhost"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y \
            python3 python-is-python3 git curl bc bison flex libssl-dev libelf-dev zip rsync

      - name: Show selected inputs
        run: |
          echo "Device:          $DEVICE_NAME ($DEVICE_MODEL)"
          echo "Platform (CPUD): $CPUD"
          echo "Android version: $ANDROID_VERSION"
          echo "Kernel version:  $KERNEL_VERSION"
          echo "Build method:    ${{ inputs.BUILD_METHOD }}"
          echo "SUSFS_CI:        ${{ inputs.SUSFS_CI }}"
          echo "VFS:             ${{ inputs.VFS }}"
          echo "KPM:             ${{ inputs.KPM }}"
          echo "ZRAM:            ${{ inputs.ZRAM }}"

      # Realme publishes OSS as plain git repos (no `repo` manifest like OnePlus).
      # The vendor-source repo IS the kernel_platform skeleton (build/, oplus/, tools/...).
      # We drop the GKI common and MSM vendor kernels into kernel_platform/{common,msm-kernel}.
      - name: Clone Realme GT8 Pro kernel sources
        run: |
          mkdir kernel_workspace && cd kernel_workspace

          echo "==> Cloning vendor source (kernel_platform skeleton + vendor blobs)"
          git clone --depth=1 "$VENDOR_REPO" tmp_vendor
          mv tmp_vendor/kernel_platform ./kernel_platform
          mv tmp_vendor/vendor ./vendor
          rm -rf tmp_vendor

          echo "==> Cloning GKI common source -> kernel_platform/common"
          git clone --depth=1 "$COMMON_REPO" kernel_platform/common

          echo "==> Cloning MSM vendor kernel source -> kernel_platform/msm-kernel"
          git clone --depth=1 "$MSM_REPO" kernel_platform/msm-kernel

          echo "==> Removing ABI protected-exports guards (KSU adds symbols)"
          if [ -e kernel_platform/common/BUILD.bazel ]; then
            sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/common/BUILD.bazel
          fi
          if [ -e kernel_platform/msm-kernel/BUILD.bazel ]; then
            sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/msm-kernel/BUILD.bazel
          fi
          rm kernel_platform/common/android/abi_gki_protected_exports_* 2>/dev/null || echo "No protected exports (common)!"
          rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* 2>/dev/null || echo "No protected exports (msm-kernel)!"

      # The oplus_setup.sh shipped in the Realme OSS hardcodes the platform to 'sun' (SM8750)
      # for every input. The GT8 Pro is 'canoe' (SM8850), so force it here.
      - name: Patch build platform (sun -> canoe)
        run: |
          cd kernel_workspace
          SETUP=kernel_platform/oplus/build/oplus_setup.sh
          sed -i 's/variants_platform=sun/variants_platform=canoe/g' "$SETUP"
          sed -i 's/OPLUS_VND_BUILD_PLATFORM=SM8750/OPLUS_VND_BUILD_PLATFORM=SM8850/g' "$SETUP"
          echo "Patched platform routing:"
          grep -n "variants_platform=canoe\|OPLUS_VND_BUILD_PLATFORM" "$SETUP" || true

      - name: Force remove -dirty suffix
        run: |
          cd kernel_workspace/kernel_platform
          for sv in common/scripts/setlocalversion msm-kernel/scripts/setlocalversion external/dtc/scripts/setlocalversion; do
            [ -f "$sv" ] && sed -i 's/ -dirty//g' "$sv"
          done
          if [ -f common/scripts/setlocalversion ]; then
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' common/scripts/setlocalversion
          fi
          # kernel_platform itself is not a git repo here, so commit inside each sub-repo instead.
          for d in common msm-kernel; do
            if [ -d "$d/.git" ]; then
              git -C "$d" add -A
              git -C "$d" -c user.name=ci -c user.email=ci@ci commit -m "Force remove -dirty suffix" || true
            fi
          done

      - name: Add KernelSU-SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          cd ./KernelSU
          KSU_VERSION=$(expr $(/usr/bin/git rev-list --count main) "+" 10606)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          export KSU_VERSION=$KSU_VERSION
          sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=${KSU_VERSION}/" kernel/Makefile

      - name: Apply SUSFS patches
        run: |
          cd kernel_workspace
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          cd kernel_platform
          echo "Applying SUSFS patch to kernel"
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
          cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

          if [ "${{ inputs.ZRAM }}" = "true" ]; then
            echo "Applying ZRAM (LZ4K) patch sources"
            cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux
            cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib
            cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto
            cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          fi

          cd ./common
          patch -p1 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
          echo "Done"

      - name: Apply Hide Stuff patches
        run: |
          cd kernel_workspace/kernel_platform/common
          cp ../../SukiSU_patch/69_hide_stuff.patch ./
          echo "Applying app-hiding patch (task_mmu.c)"
          # The base.c hunk was written for the pre-6.12 `*path = vma->vm_file->f_path;`
          # form; Realme's 6.12 kernel uses file_user_path(), so that one hunk is rejected.
          # Tolerate it here (task_mmu.c hunks still land) and apply an equivalent, 6.12-
          # correct base.c change with the helper below.
          patch -p1 -F 3 --no-backup-if-mismatch < 69_hide_stuff.patch || true
          echo "Applying 6.12-compatible base.c hide patch"
          python3 "$GITHUB_WORKSPACE/.github/scripts/fix_hide_stuff_base.py" fs/proc/base.c
          rm -f fs/proc/base.c.rej fs/proc/base.c.orig fs/proc/task_mmu.c.rej fs/proc/task_mmu.c.orig

      - name: Apply LZ4KD
        run: |
          cd kernel_workspace/kernel_platform/common
          if [ "${{ inputs.ZRAM }}" = "true" ]; then
            cp ../../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch ./
            echo "Applying lz4kd patch"
            patch -p1 -F 3 < lz4kd.patch || true
            echo 'LZ4KD patch done'
          fi

      - name: Add configuration settings
        run: |
          cd kernel_workspace/kernel_platform
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig

          # SukiSU Ultra config
          echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
          echo "CONFIG_KPM=y" >> "$CONFIG_FILE"

          # SUSFS config
          echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CONFIG_FILE"

          # Remove check_defconfig
          sed -i 's/check_defconfig//' ./common/build.config.gki

          # LZ4KD / ZRAM config
          if [ "${{ inputs.ZRAM }}" = "true" ]; then
            if [ "${{ env.KERNEL_VERSION }}" = "5.10" ]; then
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
              echo "CONFIG_ZRAM=y" >> "$CONFIG_FILE"
              echo "CONFIG_MODULE_SIG=n" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_LZO=y" >> "$CONFIG_FILE"
              echo "CONFIG_ZRAM_DEF_COMP_LZ4KD=y" >> "$CONFIG_FILE"
            fi

            if [ "${{ env.KERNEL_VERSION }}" != "6.6" ] && [ "${{ env.KERNEL_VERSION }}" != "6.12" ] && [ "${{ env.KERNEL_VERSION }}" != "5.10" ]; then
              if grep -q "CONFIG_ZSMALLOC" -- "$CONFIG_FILE"; then
                sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/g' "$CONFIG_FILE"
              else
                echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
              fi
              sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
            fi

            if [ "${{ env.KERNEL_VERSION }}" = "6.6" ] || [ "${{ env.KERNEL_VERSION }}" = "6.12" ]; then
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
              sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
            fi

            if [ "${{ env.ANDROID_VERSION }}" = "android14" ] || [ "${{ env.ANDROID_VERSION }}" = "android15" ] || [ "${{ env.ANDROID_VERSION }}" = "android16" ]; then
              if [ -e ./common/modules.bzl ]; then
                sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "./common/modules.bzl"
              fi

              if [ -e ./msm-kernel/modules.bzl ]; then
                sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "./msm-kernel/modules.bzl"
                echo "CONFIG_ZSMALLOC=y" >> "msm-kernel/arch/arm64/configs/${{ env.CPUD }}-GKI.config"
                echo "CONFIG_ZRAM=y" >> "msm-kernel/arch/arm64/configs/${{ env.CPUD }}-GKI.config"
              fi

              echo "CONFIG_MODULE_SIG_FORCE=n" >> "$CONFIG_FILE"
            elif [ "${{ env.KERNEL_VERSION }}" = "5.10" ] || [ "${{ env.KERNEL_VERSION }}" = "5.15" ]; then
              rm "common/android/gki_aarch64_modules"
              touch "common/android/gki_aarch64_modules"
            fi

            if grep -q "CONFIG_ZSMALLOC=y" "$CONFIG_FILE" && grep -q "CONFIG_ZRAM=y" "$CONFIG_FILE"; then
              echo "CONFIG_CRYPTO_LZ4HC=y" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_LZ4K=y" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_LZ4KD=y" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_842=y" >> "$CONFIG_FILE"
              echo "CONFIG_ZRAM_WRITEBACK=y" >> "$CONFIG_FILE"
            fi
          fi

      - name: Build kernel
        run: |
          cd kernel_workspace
          LTO=thin SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 \
            ./kernel_platform/oplus/build/oplus_build_kernel.sh ${{ env.CPUD }} ${{ inputs.BUILD_METHOD }}

      - name: Make AnyKernel3
        run: |
          git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git

          dir1="kernel_workspace/kernel_platform/out/msm-kernel-${{ env.CPUD }}-${{ inputs.BUILD_METHOD }}/dist/"
          dir2="kernel_workspace/kernel_platform/bazel-out/k8-fastbuild/bin/msm-kernel/${{ env.CPUD }}_gki_kbuild_mixed_tree/"
          dir3="kernel_workspace/kernel_platform/out/msm-${{ env.CPUD }}-${{ env.CPUD }}-${{ inputs.BUILD_METHOD }}/dist/"
          dir4="kernel_workspace/kernel_platform/out/msm-kernel-${{ env.CPUD }}-${{ inputs.BUILD_METHOD }}/gki_kernel/common/arch/arm64/boot/"
          dir5="kernel_workspace/kernel_platform/out/msm-${{ env.CPUD }}-${{ env.CPUD }}-${{ inputs.BUILD_METHOD }}/gki_kernel/common/arch/arm64/boot/"

          # Locate the Image
          if find "$dir1" -name "Image" 2>/dev/null | grep -q "Image"; then
            image_path="$dir1"Image
          elif find "$dir2" -name "Image" 2>/dev/null | grep -q "Image"; then
            image_path="$dir2"Image
          elif find "$dir3" -name "Image" 2>/dev/null | grep -q "Image"; then
            image_path="$dir3"Image
          elif find "$dir4" -name "Image" 2>/dev/null | grep -q "Image"; then
            image_path="$dir4"Image
          elif find "$dir5" -name "Image" 2>/dev/null | grep -q "Image"; then
            image_path="$dir5"Image
          else
            image_path=$(find ./kernel_workspace/kernel_platform/ -name "Image" 2>/dev/null | head -n 1)
          fi

          # Copy Image
          if [ -n "$image_path" ] && [ -f "$image_path" ]; then
            mkdir -p "$dir1"
            if [ "$(realpath "$image_path")" != "$(realpath "$dir1"Image)" ]; then
              cp "$image_path" "$dir1"
            else
              echo "Source and target identical, skip copy"
            fi
            cp "$dir1"Image ./AnyKernel3/Image
          else
            echo "Image not found - build likely failed"
            exit 1
          fi

          # Copy companion images if the build produced them (canoe / SM8850)
          for file in dtbo.img system_dlkm.erofs.img vendor_dlkm.img vendor_boot.img; do
            if [ -f "$dir1$file" ]; then
              target_name="$file"
              if [ "$file" = "system_dlkm.erofs.img" ]; then
                target_name="system_dlkm.img"
              fi
              cp "$dir1$file" "./AnyKernel3/$target_name"
            else
              echo "$file not present, skipping"
            fi
          done

      - name: Apply patch_linux and replace Image (KPM)
        if: ${{ inputs.KPM }}
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/out/msm-kernel-${{ env.CPUD }}-${{ inputs.BUILD_METHOD }}/dist"
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch_linux
          chmod +x patch_linux
          ./patch_linux
          rm -f Image
          mv oImage Image
          cp Image "$GITHUB_WORKSPACE/AnyKernel3/Image"

      - name: Download latest SUSFS module from CI
        if: ${{ inputs.SUSFS_CI }}
        run: |
          LATEST_RUN_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs?status=success" | \
            jq -r '.workflow_runs[] | select(.head_branch == "v1.5.2+") | .id' | head -n 1)

          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No successful run found for branch v1.5.2+"
            exit 1
          fi

          ARTIFACT_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$LATEST_RUN_ID/artifacts" | jq -r '.artifacts[0].archive_download_url')

          curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o ksu_module_susfs.zip "$ARTIFACT_URL"
          cp ksu_module_susfs.zip ./AnyKernel3/

      - name: Download latest SUSFS module from Release
        if: ${{ ! inputs.SUSFS_CI }}
        run: |
          wget https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip
          cp ksu_module_susfs_1.5.2+.zip ./AnyKernel3/

      - name: Set suffix
        id: suffix
        run: |
          echo "value=${{ inputs.KPM && '_KPM' || '' }}${{ inputs.VFS && '_VFS' || '' }}${{ inputs.ZRAM && '_LZ4KD' || '' }}" >> $GITHUB_OUTPUT

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_SukiSUUltra_${{ env.KSUVER }}_${{ env.DEVICE_NAME }}_${{ env.CPUD }}${{ steps.suffix.outputs.value }}
          path: ./AnyKernel3/*
